syntax = "proto3";

package core.v1;

option go_package = "github.com/AndreeJait/zora-code-rpc/generated/go/core/v1;corev1";
option java_multiple_files = true;
option csharp_namespace = "ZoraCode.Rpc.Core.V1";

import "common/v1/types.proto";
import "core/v1/project.proto";
import "core/v1/task.proto";

// Plan is a lightweight planning conversation that produces specs under a
// workspace and can be promoted into a real Project.
message Plan {
  string id = 1;
  string name = 2;
  string description = 3;
  string provider_id = 4;
  string runtime_id = 5;
  string project_id = 6;
  string workspace_folder = 7;
  string prompt = 8;
  string generated_summary = 9;
  common.v1.Status status = 10;
  common.v1.Timestamps timestamps = 11;
  repeated PlanMessage messages = 12;
  bool create_specs = 13;
}

// PlanMessage is a single turn inside a Plan thread.
message PlanMessage {
  string id = 1;
  string plan_id = 2;
  string role = 3;
  string content = 4;
  string task_id = 5;
  common.v1.Timestamps timestamps = 6;
}

// Model is a provider-bound model registry entry managed independently of
// Provider.allowedModels for backwards compatibility.
message Model {
  string id = 1;
  string provider_id = 2;
  string name = 3;
  string description = 4;
  bool is_active = 5;
  common.v1.Timestamps timestamps = 6;
}

message CreatePlanRequest {
  string name = 1;
  string description = 2;
  string provider_id = 3;
  string prompt = 4;
  string project_id = 5;
  bool create_specs = 6;
}

message UpdatePlanRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string prompt = 4;
  optional bool create_specs = 5;
}

message GetPlanRequest { string id = 1; }

message ListPlansRequest {}

message ListPlansResponse { repeated Plan plans = 1; }

message SendPlanMessageRequest {
  string plan_id = 1;
  string content = 2;
}

message CreateProjectFromPlanRequest {
  string plan_id = 1;
  string runtime_id = 2;
  string name = 3;
  string description = 4;
}

message GeneratePlanSpecsRequest {
  string plan_id = 1;
  string instructions = 2;
}

message CreateFirstTaskFromPlanRequest {
  string plan_id = 1;
  string prompt = 2;
}

message ListModelsRequest { string provider_id = 1; }

message ListModelsResponse { repeated Model models = 1; }

message GetModelRequest { string id = 1; }

message CreateModelRequest {
  string provider_id = 1;
  string name = 2;
  string description = 3;
}

message UpdateModelRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional bool is_active = 4;
}

message DeleteModelRequest { string id = 1; }

service PlanService {
  rpc CreatePlan(CreatePlanRequest) returns (Plan);
  rpc UpdatePlan(UpdatePlanRequest) returns (Plan);
  rpc DeletePlan(GetPlanRequest) returns (common.v1.DeleteResponse);
  rpc GetPlan(GetPlanRequest) returns (Plan);
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc SendPlanMessage(SendPlanMessageRequest) returns (PlanMessage);
  rpc CreateProjectFromPlan(CreateProjectFromPlanRequest) returns (core.v1.Project);
  rpc GeneratePlanSpecs(GeneratePlanSpecsRequest) returns (Plan);
  rpc CreateFirstTaskFromPlan(CreateFirstTaskFromPlanRequest) returns (core.v1.Task);
}

service ModelService {
  rpc CreateModel(CreateModelRequest) returns (Model);
  rpc UpdateModel(UpdateModelRequest) returns (Model);
  rpc DeleteModel(DeleteModelRequest) returns (common.v1.DeleteResponse);
  rpc GetModel(GetModelRequest) returns (Model);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
}
